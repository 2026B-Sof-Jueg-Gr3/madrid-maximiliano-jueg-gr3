<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEON//ARENA — Arena Shooter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- El canvas es la capa donde game.js dibuja la arena y sus entidades. -->
  <canvas id="game" aria-label="Arena shooter neón. Mueve el jugador con WASD, apunta con el ratón y dispara con clic."></canvas>

  <!-- Menú principal y paneles secundarios (opciones, créditos, pausa y fin). -->
  <div id="menu" class="screen">
    <div class="menu-panel">
      <div class="eyebrow">ARCADE SURVIVAL · 2089</div>
      <h1>NEON<span>//</span><br>ARENA</h1>
      <p class="subtitle">SOBREVIVE A LA OLEADA</p>
      <nav id="main-menu" class="menu-actions">
        <button class="menu-button primary" data-action="play"><span>01</span> JUGAR <b>↗</b></button>
        <button class="menu-button" data-action="options"><span>02</span> OPCIONES <b>＋</b></button>
        <button class="menu-button" data-action="credits"><span>03</span> CRÉDITOS <b>＋</b></button>
      </nav>
      <div class="menu-foot"><span>MEJOR PUNTUACIÓN</span><strong id="best-score">000000</strong></div>
    </div>
    <div id="subpanel" class="subpanel hidden"></div>
    <div class="menu-controls">WASD mover <i>·</i> RATÓN apuntar <i>·</i> CLIC disparar <i>·</i> ESC pausa</div>
  </div>

  <!-- HUD visible durante la partida: puntuación, oleada, energía y mejoras. -->
  <div id="game-hud" class="game-hud hidden">
    <div class="hud-brand">NEON<span>//</span>ARENA</div>
    <div class="stat"><small>PUNTOS</small><strong id="score">000000</strong></div>
    <div class="stat"><small>OLEADA</small><strong id="wave">01</strong></div>
    <div class="stat lives-stat"><small>ENERGÍA</small><strong id="lives">◆ ◆ ◆</strong></div>
    <div id="boost-status" class="boost-status"></div>
    <button id="pause-button" class="pause-button" aria-label="Pausar">Ⅱ</button>
  </div>
  <div id="toast" class="toast hidden"></div>
  <div class="game-footer"><span>SECTOR 07 · NEO TOKYO</span><span>NO SIGNAL. NO MERCY.</span></div>

  <!-- La lógica vive en este archivo; los estilos se cargan desde styles.css. -->
  <script src="game.js"></script>
</body>
</html>
